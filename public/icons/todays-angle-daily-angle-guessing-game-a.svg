<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The dark-mode board's angle as an "A", with the wordmark's degree symbol at its top right:
       light rays, orange arc heavier than the rays, faint orange wedge, accent-blue ring, on the
       dark surface (#151517, the dark theme's page background). Colours are fixed hex because an
       icon cannot read the page's CSS variables; the TopBar draws the same mark with the tokens. -->
  <rect width="100" height="100" rx="8" fill="#151517"/>
  <g transform="translate(-5 0)">
    <!-- Filled wedge -->
    <path d="M 50 15 L 31 53 A 32 32 0 0 0 69 53 Z" fill="rgba(251, 146, 60, 0.18)"/>
    <!-- Left leg -->
    <line x1="50" y1="15" x2="15" y2="88" stroke="#d7dadc" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="50" y1="15" x2="85" y2="88" stroke="#d7dadc" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Arc -->
    <path d="M 31 53 A 32 32 0 0 0 69 53" fill="none" stroke="#fb923c" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Vertex dot -->
    <circle cx="50" cy="15" r="5" fill="#d7dadc"/>
  </g>
  <!-- Degree symbol (dark theme accent) -->
  <circle cx="80" cy="22" r="8.5" fill="none" stroke="#818cf8" stroke-width="6.5"/>
</svg>
