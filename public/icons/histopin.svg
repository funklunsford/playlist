<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bg" cx="30%" cy="18%" r="110%">
      <stop offset="0" stop-color="#13203f"/>
      <stop offset="1" stop-color="#060b18"/>
    </radialGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#bg)"/>

  <!-- ground glow -->
  <ellipse cx="64" cy="104" rx="20" ry="5" fill="#f97316" opacity="0.5" filter="url(#soft)"/>

  <!-- orbit ring -->
  <ellipse cx="64" cy="64" rx="46" ry="15" fill="none" stroke="url(#ring)" stroke-width="3.5"
    stroke-linecap="round" opacity="0.9" transform="rotate(-18 64 64)" stroke-dasharray="150 90"
    stroke-dashoffset="-24"/>

  <!-- pin -->
  <path d="M64 20c-15.5 0-28 12.4-28 27.7C36 66.5 64 104 64 104s28-37.5 28-56.3C92 32.4 79.5 20 64 20z"
    fill="url(#pin)"/>

  <!-- globe inside pin head -->
  <circle cx="64" cy="48" r="15" fill="#0a1122"/>
  <g fill="none" stroke="#fde68a" stroke-width="2">
    <circle cx="64" cy="48" r="15"/>
    <ellipse cx="64" cy="48" rx="6.8" ry="15"/>
    <path d="M49.6 43h28.8M49.6 53h28.8"/>
  </g>

  <!-- sparkles -->
  <path d="M103 27l1.8 4.6 4.6 1.8-4.6 1.8-1.8 4.6-1.8-4.6-4.6-1.8 4.6-1.8z" fill="#22d3ee"/>
  <path d="M24 88l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#fbbf24"/>
</svg>
