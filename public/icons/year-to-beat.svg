<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="32" height="32" fill="#1a1a2e" rx="4"/>
  
  <!-- Cassette tape body -->
  <rect x="4" y="8" width="24" height="16" fill="#e94560" rx="2"/>
  <rect x="6" y="10" width="20" height="12" fill="#16213e" rx="1"/>
  
  <!-- Tape reels -->
  <circle cx="11" cy="16" r="4" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  <circle cx="21" cy="16" r="4" fill="#0f3460" stroke="#e94560" stroke-width="1"/>
  
  <!-- Reel centers -->
  <circle cx="11" cy="16" r="1.5" fill="#e94560"/>
  <circle cx="21" cy="16" r="1.5" fill="#e94560"/>
  
  <!-- Tape -->
