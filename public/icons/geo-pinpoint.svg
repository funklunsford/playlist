<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Geo Pinpoint">
  <!-- Proximity rings in the game's heat ramp (cold blue → plum → hot red), closing
       on a point. Encodes the mechanic every game shares — "hotter as you close in" —
       and the name, rather than being another generic globe. Reads at 16px because
       it is three concentric shapes and nothing else. -->
  <defs>
    <linearGradient id="gp-sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f69c4"/>
      <stop offset="55%" stop-color="#894d77"/>
      <stop offset="100%" stop-color="#e4312a"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="#05070d"/>

  <!-- Outer ring: cold. Broken at the lower-left so the ring reads as a sweep
       rather than a flat target. -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#2f69c4"
          stroke-width="2.2" stroke-linecap="round" opacity="0.5"
          stroke-dasharray="58 14" transform="rotate(120 16 16)"/>

  <!-- Middle ring: warming. -->
  <circle cx="16" cy="16" r="7.4" fill="none" stroke="url(#gp-sweep)"
          stroke-width="2.4" stroke-linecap="round"
          stroke-dasharray="38 9" transform="rotate(150 16 16)"/>

  <!-- The pinpoint. -->
  <circle cx="16" cy="16" r="3.4" fill="#e4312a"/>
  <circle cx="16" cy="16" r="3.4" fill="none" stroke="#ff8a80" stroke-width="0.9" opacity="0.55"/>
</svg>
