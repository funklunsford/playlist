<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0ede8"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#236b44"/>
      <stop offset="100%" stop-color="#164a30"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Playing card -->
  <rect x="6" y="4" width="20" height="24" rx="3" fill="url(#card)" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>
  <!-- Spade suit -->
  <text x="16" y="21" text-anchor="middle" font-size="14" fill="#1a1a2e" font-family="Georgia, serif">♠</text>
  <!-- Corner rank -->
  <text x="9" y="12" font-size="6" fill="#1a1a2e" font-weight="bold" font-family="Georgia, serif">A</text>
</svg>
