<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Light or dark comes from the device, in CSS (src/styles.css), so it's right before the first paint. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The browser's own colour around the page: the paper by day, the chalkboard by night. -->
    <meta name="theme-color" content="#fbf7ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c2a23" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Puzzle Playlist</title>
    <meta name="description" content="Today's puzzles as a worksheet: start the first, tick it off, and on to the next." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
